name: Collaborative Workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1 Checkout the repository onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 Work out who pushed and record it in index.html
      - name: Update index.html
        run: |
          case "${{ github.actor }}" in
            QUQerty) LABEL="Team Leader" ;;
            *)       LABEL="${{ github.actor }}" ;;
          esac
          sed -i '/<\/body>/i <p>Updated by '"$LABEL"' on '"$(date)"'</p>' index.html

      # Step 3 Append a log entry to the README
      - name: Update README
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      # Step 4 Commit both files back to the repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
